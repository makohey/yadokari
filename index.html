<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ひとりメモ - ひとりチャットメモ v14</title>
<style>
  :root{
    --bg:#f7f0e8;
    --panel:#fffaf3;
    --ink:#3a2c24;
    --muted:#8b786b;
    --line:#eadccc;
    --accent:#f3a7a2;
    --accent2:#bfe0c1;
    --bubble:#dcf4d8;
    --left:#ffffff;
    --shadow:0 12px 32px rgba(72,45,28,.14);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
    background:linear-gradient(180deg,#f9f2ea,#efe2d6);
    color:var(--ink);
    height:100svh;
    overflow:hidden;
  }
  button,input,textarea{font:inherit}
  .app{
    height:100svh;
    max-width:720px;
    margin:0 auto;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
    box-shadow:0 0 0 1px rgba(0,0,0,.04);
  }
  header{
    height:62px;
    padding:10px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,250,243,.92);
    backdrop-filter: blur(10px);
    border-bottom:1px solid var(--line);
    z-index:5;
  }
  .title{
    text-align:center;
    line-height:1.1;
    font-weight:800;
    letter-spacing:.02em;
  }
  .title small{
    display:block;
    font-size:11px;
    color:var(--muted);
    font-weight:600;
    margin-top:3px;
  }
  .topBtns{
    display:flex;
    gap:6px;
    min-width:130px;
  }
  .topBtns.right{justify-content:flex-end}
  .btn{
    border:1px solid var(--line);
    background:#fffaf5;
    color:var(--ink);
    border-radius:999px;
    padding:8px 10px;
    font-size:13px;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.04);
  }
  .btn:active{transform:scale(.98)}
  .chat{
    flex:1;
    overflow:auto;
    padding:16px 12px 96px;
    scroll-behavior:smooth;
  }
  .day{
    width:max-content;
    margin:4px auto 18px;
    padding:5px 12px;
    border-radius:999px;
    color:var(--muted);
    background:#efe4d8;
    font-size:12px;
  }
  .row{
    display:flex;
    gap:8px;
    margin:10px 0;
    align-items:flex-end;
  }
  .row.user{justify-content:flex-end}
  .avatar{
    width:34px;height:34px;border-radius:50%;
    display:grid;place-items:center;
    background:#fff5ec;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
    flex:0 0 34px;
    font-size:21px;
    user-select:none;
  }
  .bubble{
    max-width:min(78%,520px);
    padding:10px 12px;
    border-radius:18px;
    line-height:1.55;
    white-space:pre-wrap;
    word-break:break-word;
    box-shadow:0 4px 14px rgba(0,0,0,.06);
    position:relative;
  }
  .reactBadge{
    position:absolute;
    bottom:-12px;
    right:-2px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:999px;
    padding:1px 6px;
    font-size:13px;
    line-height:1.4;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    pointer-events:none;
  }
  .row.hasReact{margin-bottom:18px}
  .reactRow{
    display:flex;
    gap:8px;
    justify-content:center;
    margin:4px 0 10px;
  }
  .reactBtn{
    width:46px;
    height:46px;
    border-radius:50%;
    border:1px solid var(--line);
    background:#fff;
    font-size:21px;
    cursor:pointer;
  }
  .reactBtn:active{transform:scale(.94)}
  .reactBtn.on{
    background:#ffe7c7;
    border-color:#e8c9a8;
  }
  .menuPreview{
    font-size:12px;
    color:var(--muted);
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    padding:8px 10px;
    margin-bottom:10px;
    max-height:64px;
    overflow:hidden;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .user .bubble{
    background:var(--bubble);
    border-bottom-right-radius:5px;
  }
  .bot .bubble{
    background:var(--left);
    border-bottom-left-radius:5px;
  }
  .meta{
    font-size:10px;
    color:var(--muted);
    margin:0 4px 2px;
  }
  .composer{
    position:absolute;
    left:0;right:0;bottom:0;
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));
    background:rgba(255,250,243,.94);
    backdrop-filter: blur(12px);
    border-top:1px solid var(--line);
    display:flex;
    gap:8px;
    align-items:flex-end;
    z-index:6;
  }
  textarea{
    flex:1;
    min-height:44px;
    max-height:132px;
    resize:none;
    border:1px solid var(--line);
    outline:none;
    border-radius:18px;
    padding:11px 12px;
    background:white;
    color:var(--ink);
    box-shadow:inset 0 1px 0 rgba(0,0,0,.02);
  }
  .send{
    min-width:64px;
    border:none;
    color:white;
    background:#d9857e;
    border-radius:16px;
    padding:12px 14px;
    font-weight:800;
    cursor:pointer;
  }
  .send:active{transform:scale(.98)}
  .overlay{
    position:absolute; inset:0;
    background:rgba(26,20,18,.28);
    display:none;
    z-index:20;
    padding:18px;
    align-items:center;
    justify-content:center;
  }
  .modal{
    width:min(560px,100%);
    max-height:86svh;
    overflow:auto;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:24px;
    box-shadow:var(--shadow);
    padding:16px;
  }
  .modal h2{margin:0 0 10px;font-size:18px}

  .modalHead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:10px;
  }
  .modalHead h2{
    margin:0;
  }
  .iconBtn{
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    width:36px;
    height:36px;
    border-radius:50%;
    font-size:18px;
    cursor:pointer;
  }

  .modalActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .field{
    margin:12px 0;
  }
  .field label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:6px;
    font-weight:700;
  }
  .field input,.field select{
    width:100%;
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 12px;
    background:white;
    color:var(--ink);
  }
  .switchRow{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 0;border-bottom:1px solid var(--line);
    gap:12px;
  }
  .switchRow span small{display:block;color:var(--muted);margin-top:2px}
  .toggle{
    width:52px;height:30px;border-radius:999px;border:none;
    background:#d6c7ba;position:relative;cursor:pointer;flex:0 0 52px;
  }
  .toggle::after{
    content:"";position:absolute;top:4px;left:4px;
    width:22px;height:22px;border-radius:50%;background:white;
    transition:.18s;
  }
  .toggle.on{background:#80be86}
  .toggle.on::after{left:26px}

  .searchBox{
    position:sticky;
    top:0;
    z-index:2;
    background:var(--panel);
    padding:4px 0 10px;
  }
  .searchInput{
    width:100%;
    border:1px solid var(--line);
    border-radius:16px;
    padding:11px 12px;
    background:white;
    color:var(--ink);
    outline:none;
  }
  .hitMark{
    display:inline-block;
    font-size:11px;
    color:#9b675f;
    background:#ffe7dc;
    border-radius:999px;
    padding:2px 8px;
    margin-top:6px;
  }

  .listItem{
    border:1px solid var(--line);
    background:white;
    border-radius:16px;
    padding:12px;
    margin:8px 0;
    cursor:pointer;
  }
  .listItem strong{display:block;margin-bottom:4px}
  .listItem small{color:var(--muted)}
  .lock{
    position:absolute; inset:0;
    background:#030303;
    color:white;
    display:none;
    z-index:50;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    overflow:hidden;
    user-select:none;
  }
  .lock.show{display:flex}
  .eyes{
    width:220px;height:90px;
    position:relative;
    animation:floaty 5.8s ease-in-out infinite;
  }
  .eye{
    position:absolute;top:25px;
    width:54px;height:34px;
    border-radius:50%;
    background:radial-gradient(circle at 55% 45%,#fff 0 10%,#ffd06a 11% 35%,#111 36% 55%,#ffdc84 56% 100%);
    box-shadow:0 0 18px rgba(255,208,106,.42),0 0 42px rgba(255,208,106,.18);
    transform-origin:center;
    animation:blink 7s infinite;
  }
  .eye.left{left:34px}
  .eye.right{right:34px}
  .shell{
    font-size:34px;
    opacity:.28;
    margin-top:18px;
    animation:pulse 4s ease-in-out infinite;
  }

  .catParts{
    position:absolute;
    width:220px;
    height:120px;
    top:calc(50% - 96px);
    left:50%;
    transform:translateX(-50%);
    pointer-events:none;
  }
  .ear{
    position:absolute;
    top:0;
    width:0;height:0;
    border-left:28px solid transparent;
    border-right:28px solid transparent;
    border-bottom:58px solid rgba(255,255,255,.16);
    filter:drop-shadow(0 0 12px rgba(255,255,255,.08));
  }
  .lockImg{
    display:none;
    max-width:min(72vw,420px);
    max-height:46svh;
    border-radius:22px;
    object-fit:contain;
    box-shadow:0 0 26px rgba(255,255,255,.16),0 0 70px rgba(255,208,106,.12);
    animation:floaty 5.8s ease-in-out infinite;
    user-select:none;
    -webkit-user-drag:none;
  }
  .lock.customImg .eyes,
  .lock.customImg .catParts{display:none}
  .lock.customImg .lockImg{display:block}
  .leftEar{left:34px; transform:rotate(-18deg)}
  .rightEar{right:34px; transform:rotate(18deg)}  .lockMood{
    position:absolute;
    top:calc(50% + 64px);
    color:rgba(255,255,255,.42);
    font-size:22px;
    letter-spacing:.2em;
  }
  .lock.eyesOnly .catParts{display:none}  .lock.half .eye{height:15px; top:35px; opacity:.86}
  .lock.teary .eye::after{
    content:"";
    position:absolute;
    width:9px;height:16px;
    background:rgba(135,211,255,.7);
    border-radius:999px;
    bottom:-18px;right:9px;
    box-shadow:0 0 12px rgba(135,211,255,.45);
  }

  .lockHint{
    position:absolute;
    bottom:calc(26px + env(safe-area-inset-bottom));
    color:rgba(255,255,255,.34);
    font-size:12px;
    letter-spacing:.12em;
  }
  .passBox{
    display:none;
    position:absolute;
    bottom:calc(60px + env(safe-area-inset-bottom));
    width:min(280px,80%);
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16);
    border-radius:18px;
    padding:12px;
    backdrop-filter: blur(10px);
  }
  .passBox.show{display:block}
  .passBox input{
    width:100%;padding:11px;border-radius:12px;border:1px solid rgba(255,255,255,.18);
    background:rgba(0,0,0,.35);color:white;outline:none;text-align:center;
    letter-spacing:.2em;
  }
  .passErr{height:18px;color:#ffaaa4;text-align:center;font-size:12px;margin-top:7px}
  @keyframes blink{
    0%,4%,8%,100%{transform:scaleY(1)}
    5%,6.4%{transform:scaleY(.06)}
    58%,61%,64%{transform:scaleY(1)}
    62%{transform:scaleY(.08)}
  }
  @keyframes floaty{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
  }
  @keyframes pulse{
    0%,100%{opacity:.22;transform:scale(1)}
    50%{opacity:.38;transform:scale(1.05)}
  }
  .bubble.typing{
    display:flex;
    gap:5px;
    align-items:center;
    padding:15px 14px;
  }
  .bubble.typing .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#c9b8a8;
    animation:typingDot 1.1s infinite ease-in-out;
  }
  .bubble.typing .dot:nth-child(2){animation-delay:.18s}
  .bubble.typing .dot:nth-child(3){animation-delay:.36s}
  @keyframes typingDot{
    0%,60%,100%{transform:translateY(0);opacity:.5}
    30%{transform:translateY(-4px);opacity:1}
  }
  .empty{
    color:var(--muted);
    text-align:center;
    padding:28px 8px;
  }

  .tinyNote{
    font-size:12px;
    line-height:1.6;
    color:var(--muted);
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 12px;
  }

  .toast{
    position:absolute;
    left:50%;bottom:92px;
    transform:translateX(-50%);
    background:rgba(58,44,36,.9);
    color:white;
    padding:9px 13px;
    border-radius:999px;
    font-size:13px;
    display:none;
    z-index:60;
  }
  .toast.show{display:block}
  .bubble img.msgImg{
    display:block;
    max-width:100%;
    max-height:320px;
    border-radius:12px;
    margin:2px 0;
    cursor:zoom-in;
    background:#eadccc;
  }
  .bubble img.msgImg + .bubbleText{
    margin-top:6px;
  }
  .bubbleText{
    white-space:pre-wrap;
    word-break:break-word;
  }
  .msgLink{
    color:#b06a5f;
    text-decoration:underline;
    word-break:break-all;
  }
  .attachBtn{
    border:1px solid var(--line);
    background:#fffaf5;
    color:var(--ink);
    width:44px;
    height:44px;
    border-radius:50%;
    font-size:20px;
    cursor:pointer;
    flex:0 0 44px;
    display:grid;
    place-items:center;
  }
  .attachBtn:active{transform:scale(.96)}
  .imgPreview{
    position:absolute;
    left:10px;
    bottom:calc(100% + 6px);
    background:#fffaf3;
    border:1px solid var(--line);
    border-radius:14px;
    padding:6px;
    box-shadow:0 6px 18px rgba(0,0,0,.1);
    display:none;
    z-index:7;
  }
  .imgPreview.show{display:block}
  .imgPreview img{
    display:block;
    width:72px;
    height:72px;
    object-fit:cover;
    border-radius:10px;
  }
  .imgPreview .removeImg{
    position:absolute;
    top:-8px;
    right:-8px;
    width:24px;
    height:24px;
    border-radius:50%;
    background:#3a2c24;
    color:white;
    border:2px solid #fffaf3;
    font-size:14px;
    line-height:1;
    cursor:pointer;
    display:grid;
    place-items:center;
  }
  .listItem{
    position:relative;
  }
  .listItem.pinned{
    background:#fff5ea;
    border-color:#e8c9a8;
  }
  .pinBtn{
    position:absolute;
    top:8px;
    right:8px;
    width:32px;
    height:32px;
    border-radius:50%;
    border:1px solid var(--line);
    background:white;
    cursor:pointer;
    font-size:14px;
    display:grid;
    place-items:center;
    opacity:.55;
  }
  .pinBtn.on{
    background:#ffe7c7;
    border-color:#e8c9a8;
    opacity:1;
  }
  .pinDivider{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    margin:14px 0 6px;
    letter-spacing:.08em;
  }
  .imgViewer{
    position:absolute;
    inset:0;
    background:rgba(15,10,8,.92);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:80;
    padding:24px;
    cursor:zoom-out;
  }
  .imgViewer.show{display:flex}
  .imgViewer img{
    max-width:100%;
    max-height:100%;
    border-radius:12px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  @media (min-width:721px){
    .app{height:96svh;margin-top:2svh;border-radius:24px}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="topBtns">
      <button class="btn" id="newBtn">新規</button>
    </div>
    <div class="title">
      <span id="appTitle">ひとりメモ</span>
      <small>ひとりチャットメモ</small>
    </div>
    <div class="topBtns right">
      <button class="btn" id="saveBtn">保存</button>
      <button class="btn" id="listBtn">一覧</button>
      <button class="btn" id="settingsBtn">⚙︎</button>
    </div>
  </header>

  <main class="chat" id="chat">
    <div class="day">きょう</div>
  </main>

  <div class="composer">
    <div class="imgPreview" id="imgPreview">
      <button type="button" class="removeImg" id="removeImgBtn" aria-label="画像を取り消す">×</button>
      <img id="imgPreviewImg" alt="" />
    </div>
    <button class="attachBtn" id="attachBtn" type="button" aria-label="画像を添付">📎</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none" />
    <textarea id="input" placeholder="メモを書く...（改行OK）" rows="1"></textarea>
    <button class="send" id="sendBtn">送信</button>
  </div>

  <section class="lock" id="lock">
    <img class="lockImg" id="lockImg" alt="" draggable="false" />
    <div class="eyes">
      <div class="eye left"></div>
      <div class="eye right"></div>
    </div>
    
    <div class="catParts" id="catParts">
      <div class="ear leftEar"></div>
      <div class="ear rightEar"></div>    </div>
    <div class="lockMood" id="lockMood"></div>

    <div class="passBox" id="passBox">
      <input id="passInput" type="password" inputmode="numeric" placeholder="PASS" />
      <div class="passErr" id="passErr"></div>
    </div>
    <div class="lockHint" id="lockHint">tap to wake</div>
  </section>

  <div class="overlay" id="overlay">
    <div class="modal" id="modal"></div>
  </div>

  <div class="imgViewer" id="imgViewer">
    <img id="imgViewerImg" alt="" />
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const STORAGE_KEY = "hitori_memo_current_v4";
const SAVED_KEY = "hitori_memo_saved_v4";
const SETTINGS_KEY = "hitori_memo_settings_v4";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const newBtn = document.getElementById("newBtn");
const saveBtn = document.getElementById("saveBtn");
const listBtn = document.getElementById("listBtn");
const settingsBtn = document.getElementById("settingsBtn");
const overlay = document.getElementById("overlay");
const modal = document.getElementById("modal");
const lock = document.getElementById("lock");
const passBox = document.getElementById("passBox");
const passInput = document.getElementById("passInput");
const passErr = document.getElementById("passErr");
const lockHint = document.getElementById("lockHint");
const toast = document.getElementById("toast");
const attachBtn = document.getElementById("attachBtn");
const fileInput = document.getElementById("fileInput");
const imgPreview = document.getElementById("imgPreview");
const imgPreviewImg = document.getElementById("imgPreviewImg");
const removeImgBtn = document.getElementById("removeImgBtn");
const imgViewer = document.getElementById("imgViewer");
const imgViewerImg = document.getElementById("imgViewerImg");

let current = loadCurrent();
let settings = loadSettings();
let lockTimer = null;
let isLocked = false;
let pendingImage = null;

function defaultSettings(){
  return {
    appName: "ひとりメモ",
    reply: true,
    lockAnim: true,
    lockSeconds: 60,
    botMode: "hai",
    tipReply: true,
    lockLook: "cat",
    eyeMood: "normal",
    lockImage: ""
  };
}
function loadSettings(){
  try { return {...defaultSettings(), ...JSON.parse(localStorage.getItem(SETTINGS_KEY)||"{}")}; }
  catch(e){ return defaultSettings(); }
}
function saveSettings(){
  try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }
  catch(e){ showToast("保存容量がいっぱいかも…画像を小さくしてみて"); }
}

function loadCurrent(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {messages:[], dirty:false}; }
  catch(e){ return {messages:[], dirty:false}; }
}
function persistCurrent(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(current));
}
function loadSaved(){
  try { return JSON.parse(localStorage.getItem(SAVED_KEY)) || []; }
  catch(e){ return []; }
}
function saveSaved(items){
  localStorage.setItem(SAVED_KEY, JSON.stringify(items));
}
function nowTime(){
  const d = new Date();
  return d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
}
function nowDateKey(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function dateLabel(dateKey){
  if(!dateKey) dateKey = nowDateKey();
  const parts = dateKey.split("-");
  const y = Number(parts[0]);
  const m = Number(parts[1]);
  const d = Number(parts[2]);
  const dt = new Date(y, m-1, d);
  const week = ["日","月","火","水","木","金","土"][dt.getDay()];
  return `${m}/${d}（${week}）`;
}
function addDayLabel(label){
  const div = document.createElement("div");
  div.className = "day";

function appendLinkified(el, text){
  // URLだけ<a>にする。本文はtextNodeのままなのでHTML解釈されない（安全）。
  const re = /(https?:\/\/[^\s<>"']+)/g;
  let last = 0;
  let m;
  while((m = re.exec(text)) !== null){
    if(m.index > last){
      el.appendChild(document.createTextNode(text.slice(last, m.index)));
    }
    const a = document.createElement("a");
    a.href = m[0];
    a.textContent = m[0];
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.className = "msgLink";
    a.addEventListener("click", ev => ev.stopPropagation());
    el.appendChild(a);
    last = m.index + m[0].length;
  }
  if(last < text.length){
    el.appendChild(document.createTextNode(text.slice(last)));
  }
}


function resizeImageToDataUrl(file, maxSize=900, quality=0.82, format="image/jpeg"){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL(format, quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function makeReply(text){
  // このアプリの返事は、考えずに受けるだけ。
  if(settings.botMode === "off") return "";

  let base = "はーい";
  if(settings.botMode === "random"){
    const arr = ["はーい","了解","メモった","うん","🫡"];
    base = arr[Math.floor(Math.random()*arr.length)];
  }

  if(settings.tipReply){
    const tip = pickFeatureTip();
    if(tip){
      return `${base}\n${tip}`;
    }
  }
  return base;
}

function pickFeatureTip(){
  // うるさくならないよう、たまにだけ出す。
  // 最初の数回は少し出やすく、その後は約25%。
  const userCount = current.messages.filter(m => m.role === "user").length;
  const shouldShow = userCount <= 3 || Math.random() < 0.25;
  if(!shouldShow) return "";

  const tips = [
    "長押しで修正できるよー",
    "保存したメモは一覧から検索できるよー",
    "保存は自分で押した時だけだよー",
    "放置すると画面が隠れるよー",
    "名前は設定から変えられるよー",
    "改行もそのままできるよー",
    "目隠しの絵は設定から好きな画像にできるよー",
    "📎で写真も貼れるよー",
    "画像はコピペでも貼れるよー",
    "一覧の📌で大事なメモを上に固定できるよー",
    "長押しでコピーやリアクションができるよー"
  ];

  // 直近の返事と同じヒントを避ける
  const lastBot = [...current.messages].reverse().find(m => m.role === "bot");
  const lastText = lastBot ? lastBot.text : "";
  const candidates = tips.filter(t => !lastText.includes(t));
  return candidates[Math.floor(Math.random() * candidates.length)] || "";
}
function extractWords(text){
  const stop = ["これ","それ","あれ","今日","明日","昨日","あと","また","かな","やわ","する","した","して","行く","行かない","思う","かも","ちょっと"];
  const candidates = [];
  const re = /[一-龠々ァ-ヶーA-Za-z0-9０-９]{2,}/g;
  let m;
  while((m = re.exec(text)) !== null){
    let w = m[0];
    if(stop.includes(w)) continue;
    if(/^[0-9０-９]+$/.test(w)) continue;
    candidates.push(w);
  }
  const priority = ["梅田ヨドバシ","ヨドバシ","病院","歯医者","ラズパイ","Raspberry","Pi5","note","仕事","買い物","牛乳"];
  for(const p of priority){
    if(text.includes(p)) return [p];
  }
  return candidates;
}

function attachEditHandlers(el){
  let timer = null;
  const start = () => {
    timer = setTimeout(() => {
      const idx = Number(el.dataset.index);
      openActionMenu(idx);
    }, 650);
  };
  const cancel = () => {
    clearTimeout(timer);
    timer = null;
  };
  el.addEventListener("pointerdown", start);
  el.addEventListener("pointermove", cancel);
  el.addEventListener("pointerup", cancel);
  el.addEventListener("pointerleave", cancel);
  el.addEventListener("dblclick", () => {
    const idx = Number(el.dataset.index);
    openActionMenu(idx);
  });
}

const REACTIONS = ["✅","👍","❤️","😂","⭐"];

function openActionMenu(idx){
  if(!Number.isInteger(idx) || !current.messages[idx]) return;
  const msg = current.messages[idx];
  const reactRow = REACTIONS.map(e =>
    `<button type="button" class="reactBtn ${msg.react===e?"on":""}" data-react="${e}">${e}</button>`
  ).join("");
  const previewText = (msg.text || (msg.image ? "[画像]" : "")).slice(0, 60);
  openModal(`
    <div class="modalHead"><h2>この行</h2><button class="iconBtn" type="button" data-close-modal>×</button></div>
    <div class="menuPreview">${escapeHtml(previewText)}</div>
    <div class="reactRow">${reactRow}</div>
    <div class="modalActions">
      <button class="btn" id="amCopy">コピー</button>
      <button class="btn" id="amShare">この行を共有</button>
      <button class="btn" id="amEdit">修正</button>
      <button class="btn" id="amDelete">削除</button>
    </div>
  `);
  modal.querySelectorAll(".reactBtn").forEach(b => {
    b.onclick = () => {
      const e = b.dataset.react;
      if(current.messages[idx].react === e){
        delete current.messages[idx].react;
      }else{
        current.messages[idx].react = e;
      }
      current.dirty = true;
      persistCurrent();
      closeModal();
      render();
    };
  });
  document.getElementById("amCopy").onclick = async () => {
    const t = msg.text || "";
    if(!t){ showToast("この行にテキストがないよ"); return; }
    closeModal();
    try{
      await navigator.clipboard.writeText(t);
      showToast("コピーした");
    }catch(e){
      shareText(t, "メモ");
    }
  };
  document.getElementById("amShare").onclick = () => {
    closeModal();
    shareText(msg.text || "[画像]", "メモ");
  };
  document.getElementById("amEdit").onclick = () => {
    openEditMessage(idx);
  };
  document.getElementById("amDelete").onclick = () => {
    current.messages.splice(idx,1);
    current.dirty = true;
    persistCurrent();
    closeModal();
    render();
    showToast("削除した");
  };
}

function openEditMessage(idx){

      current.dirty = true;
      persistCurrent();
      closeModal();
      render();
      showToast("画像を外した");
    };
  }
  document.getElementById("saveEdit").onclick = () => {
    const val = document.getElementById("editMessageText").value;
    const stillHasImage = !!current.messages[idx].image;

      current.messages[idx].text = val;

      showToast("修正した");

    current.messages.splice(idx,1);
    current.dirty = true;
    persistCurrent();

    showToast("削除した");
  };

function showList(){
  const items = loadSaved();
  let body = `<div class="modalHead"><h2>保存済みメモ</h2><button class="iconBtn" type="button" data-close-modal>×</button></div>
    <div class="searchBox">
      <input id="memoSearch" class="searchInput" placeholder="保存済みメモを検索..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
    </div>
    <div id="memoListResults"></div>
    <div class="tinyNote">タイトルと本文から検索できます。タップするとそのメモを開きます。右上の📌でトップに固定。</div>
    <div class="tinyNote">公式メモアプリへ直接保存はブラウザからはできません。保存画面の「共有 / コピー」から、共有先にメモアプリを選ぶか、コピーして貼り付けてください。</div>
    <div class="modalActions"><button type="button" class="btn" id="closeList" data-close-modal>閉じる</button></div>`;
  openModal(body);

  const inputEl = document.getElementById("memoSearch");
  const resultsEl = document.getElementById("memoListResults");

  function itemText(item){
    return [
      item.title || "",
      ...(item.messages || []).map(m => m.text || "")
    ].join(" ");
  }
  function itemPreview(item){
    const parts = (item.messages || []).filter(m=>m.role==="user").map(m=>{
      if(m.image && !m.text) return "[画像]";
      if(m.image && m.text) return "[画像] " + m.text;
      return m.text || "";
    });
    return parts.join(" / ").slice(0,72);
  }
  function sortItems(list){
    return [...list].sort((a,b) => {
      const ap = a.pinned ? 1 : 0;
      const bp = b.pinned ? 1 : 0;
      if(ap !== bp) return bp - ap;
      return (b.id || 0) - (a.id || 0);
    });
  }

  function renderResults(query=""){
    const q = query.trim().toLowerCase();
    let filtered = items;
    if(q){
      filtered = items.filter(item => itemText(item).toLowerCase().includes(q));
    }
    filtered = sortItems(filtered);

    if(!filtered.length){
      resultsEl.innerHTML = `<div class="empty">${q ? "見つからなかったよ。" : "保存済みメモはまだないよ。"}</div>`;
      return;
    }

    let html = "";
    let dividerShown = false;
    filtered.forEach(item => {
      if(!item.pinned && !dividerShown && filtered.some(x => x.pinned)){
        html += `<div class="pinDivider">─ そのほか ─</div>`;
        dividerShown = true;
      }
      const preview = itemPreview(item);
      const date = new Date(item.created).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
      const hit = q ? `<span class="hitMark">検索一致</span>` : "";
      html += `<div class="listItem ${item.pinned ? "pinned" : ""}" data-id="${item.id}">
        <button type="button" class="pinBtn ${item.pinned ? "on" : ""}" data-pin-id="${item.id}" aria-label="${item.pinned ? "ピンを外す" : "トップに固定"}">📌</button>
        <strong>${escapeHtml(item.title)}</strong>
        <small>${escapeHtml(date)}　${escapeHtml(preview)}</small><br>${hit}
      </div>`;
    });
    resultsEl.innerHTML = html;

    resultsEl.querySelectorAll(".pinBtn").forEach(btn => {
      btn.onclick = (ev) => {
        ev.stopPropagation();
        const id = Number(btn.dataset.pinId);
        const all = loadSaved();
        const target = all.find(x => x.id === id);
        if(!target) return;
        target.pinned = !target.pinned;
        saveSaved(all);
        const idx = items.findIndex(x => x.id === id);
        if(idx >= 0) items[idx] = target;
        renderResults(inputEl.value);
        showToast(target.pinned ? "トップに固定した" : "ピンを外した");
      };
    });

    resultsEl.querySelectorAll(".listItem").forEach(el=>{
      el.onclick = (ev) => {
        if(ev.target.closest(".pinBtn")) return;
        const id = Number(el.dataset.id);
        const item = items.find(x=>x.id===id);
        if(!item) return;
        current = {messages:[...(item.messages || [])], dirty:false};
        persistCurrent();
        closeModal();
        render();
      };
    });
  }

  inputEl.addEventListener("input", () => renderResults(inputEl.value));
  document.getElementById("closeList").onclick = closeModal;
  renderResults();
}

        <button type="button" class="btn" id="pickLockImg">画像を選ぶ</button>

        <option value="teary" ${settings.eyeMood==="teary"?"selected":""}>涙目</option>
      </select>
    </div>

    <div class="field">
      <label>自動ロックまで</label>
      <select id="lockSeconds">
        <option value="30" ${settings.lockSeconds==30?"selected":""}>30秒</option>
        <option value="60" ${settings.lockSeconds==60?"selected":""}>1分</option>
        <option value="300" ${settings.lockSeconds==300?"selected":""}>5分</option>
        <option value="600" ${settings.lockSeconds==600?"selected":""}>10分</option>

        iPhoneのSafariでは、表示名の入力時に「連絡先を自動入力」が出る場合があります。<br>

      </div>

  document.getElementById("replyToggle").onclick = e => {
    settings.reply = !settings.reply; e.currentTarget.classList.toggle("on", settings.reply);
  };
  const tipReplyToggle = document.getElementById("tipReplyToggle");
  if(tipReplyToggle){
    tipReplyToggle.onclick = e => {
      settings.tipReply = !settings.tipReply;
      e.currentTarget.classList.toggle("on", settings.tipReply);
    };

  document.getElementById("lockToggle").onclick = e => {
    settings.lockAnim = !settings.lockAnim; e.currentTarget.classList.toggle("on", settings.lockAnim);

      const fmt = f.type === "image/png" ? "image/png" : "image/jpeg";
      pendingLockImage = await resizeImageToDataUrl(f, 640, 0.85, fmt);

function lockNow(){
  applySettingsToUI();
  if(!settings.lockAnim || overlay.style.display === "flex") return;
  isLocked = true;
  lock.classList.add("show");
  passErr.textContent = "";
  passInput.value = "";
  passBox.classList.remove("show");
  lockHint.textContent = "tap to wake";
}
function unlockTry(){
  if(!isLocked) return;
  unlock();
}
function unlock(){
  isLocked = false;
  lock.classList.remove("show");
  passBox.classList.remove("show");
  resetLockTimer();
  input.focus();
}
function resetLockTimer(){
  clearTimeout(lockTimer);
  if(settings.lockAnim){
    lockTimer = setTimeout(lockNow, settings.lockSeconds * 1000);
  }
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]));
}

sendBtn.onclick = send;
input.addEventListener("input", () => { autoGrow(); resetLockTimer(); });
input.addEventListener("keydown", e => {
  // メモ用途なので、Enter / Return は改行に使う。
  // 送信は右下の「送信」ボタンで行う。
  resetLockTimer();
});
input.addEventListener("paste", async (e) => {
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  for(const it of items){
    if(it.type && it.type.startsWith("image/")){
      const file = it.getAsFile();
      if(file){
        e.preventDefault();
        await handleImageFile(file);
        return;
      }
    }
  }
});
attachBtn.onclick = () => { resetLockTimer(); fileInput.click(); };
fileInput.onchange = async (e) => {
  const file = e.target.files && e.target.files[0];
  if(file) await handleImageFile(file);
};
removeImgBtn.onclick = () => { clearPendingImage(); resetLockTimer(); };
imgViewer.addEventListener("click", closeImgViewer);
newBtn.onclick = () => { resetLockTimer(); newFlow(); };
saveBtn.onclick = () => { resetLockTimer(); saveCurrentThen(); };
listBtn.onclick = () => { resetLockTimer(); showList(); };
settingsBtn.onclick = () => { resetLockTimer(); showSettings(); };

["click","touchstart","keydown","mousemove"].forEach(ev=>{
  document.addEventListener(ev, () => { if(!isLocked) resetLockTimer(); }, {passive:true});
});
lock.addEventListener("click", unlockTry);
passInput.addEventListener("keydown", e=>{
  if(e.key === "Enter") unlock();
});
applySettingsToUI();
render();
resetLockTimer();
