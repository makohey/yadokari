<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ひとりメモ - ひとりチャットメモ v12</title>
<style>
  :root{
    --bg:#f7f0e8;
    --panel:#fffaf3;
    --ink:#3a2c24;
    --muted:#8b786b;
    --line:#eadccc;
    --accent:#f3a7a2;
    --accent2:#bfe0c1;
    --bubble:#dcf4d8;
    --left:#ffffff;
    --shadow:0 12px 32px rgba(72,45,28,.14);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
    background:linear-gradient(180deg,#f9f2ea,#efe2d6);
    color:var(--ink);
    height:100svh;
    overflow:hidden;
  }
  button,input,textarea{font:inherit}
  .app{
    height:100svh;
    max-width:720px;
    margin:0 auto;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
    box-shadow:0 0 0 1px rgba(0,0,0,.04);
  }
  header{
    height:62px;
    padding:10px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,250,243,.92);
    backdrop-filter: blur(10px);
    border-bottom:1px solid var(--line);
    z-index:5;
  }
  .title{
    text-align:center;
    line-height:1.1;
    font-weight:800;
    letter-spacing:.02em;
  }
  .title small{
    display:block;
    font-size:11px;
    color:var(--muted);
    font-weight:600;
    margin-top:3px;
  }
  .topBtns{
    display:flex;
    gap:6px;
    min-width:130px;
  }
  .topBtns.right{justify-content:flex-end}
  .btn{
    border:1px solid var(--line);
    background:#fffaf5;
    color:var(--ink);
    border-radius:999px;
    padding:8px 10px;
    font-size:13px;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.04);
  }
  .btn:active{transform:scale(.98)}
  .chat{
    flex:1;
    overflow:auto;
    padding:16px 12px 96px;
    scroll-behavior:smooth;
  }
  .day{
    width:max-content;
    margin:4px auto 18px;
    padding:5px 12px;
    border-radius:999px;
    color:var(--muted);
    background:#efe4d8;
    font-size:12px;
  }
  .row{
    display:flex;
    gap:8px;
    margin:10px 0;
    align-items:flex-end;
  }
  .row.user{justify-content:flex-end}
  .avatar{
    width:34px;height:34px;border-radius:50%;
    display:grid;place-items:center;
    background:#fff5ec;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
    flex:0 0 34px;
    font-size:21px;
    user-select:none;
  }
  .bubble{
    max-width:min(78%,520px);
    padding:10px 12px;
    border-radius:18px;
    line-height:1.55;
    white-space:pre-wrap;
    word-break:break-word;
    box-shadow:0 4px 14px rgba(0,0,0,.06);
  }
  .user .bubble{
    background:var(--bubble);
    border-bottom-right-radius:5px;
  }
  .bot .bubble{
    background:var(--left);
    border-bottom-left-radius:5px;
  }
  .meta{
    font-size:10px;
    color:var(--muted);
    margin:0 4px 2px;
  }
  .composer{
    position:absolute;
    left:0;right:0;bottom:0;
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));
    background:rgba(255,250,243,.94);
    backdrop-filter: blur(12px);
    border-top:1px solid var(--line);
    display:flex;
    gap:8px;
    align-items:flex-end;
    z-index:6;
  }
  textarea{
    flex:1;
    min-height:44px;
    max-height:132px;
    resize:none;
    border:1px solid var(--line);
    outline:none;
    border-radius:18px;
    padding:11px 12px;
    background:white;
    color:var(--ink);
    box-shadow:inset 0 1px 0 rgba(0,0,0,.02);
  }
  .send{
    min-width:64px;
    border:none;
    color:white;
    background:#d9857e;
    border-radius:16px;
    padding:12px 14px;
    font-weight:800;
    cursor:pointer;
  }
  .send:active{transform:scale(.98)}
  .overlay{
    position:absolute; inset:0;
    background:rgba(26,20,18,.28);
    display:none;
    z-index:20;
    padding:18px;
    align-items:center;
    justify-content:center;
  }
  .modal{
    width:min(560px,100%);
    max-height:86svh;
    overflow:auto;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:24px;
    box-shadow:var(--shadow);
    padding:16px;
  }
  .modal h2{margin:0 0 10px;font-size:18px}

  .modalHead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:10px;
  }
  .modalHead h2{
    margin:0;
  }
  .iconBtn{
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    width:36px;
    height:36px;
    border-radius:50%;
    font-size:18px;
    cursor:pointer;
  }

  .modalActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .field{
    margin:12px 0;
  }
  .field label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:6px;
    font-weight:700;
  }
  .field input,.field select{
    width:100%;
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 12px;
    background:white;
    color:var(--ink);
  }
  .switchRow{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 0;border-bottom:1px solid var(--line);
    gap:12px;
  }
  .switchRow span small{display:block;color:var(--muted);margin-top:2px}
  .toggle{
    width:52px;height:30px;border-radius:999px;border:none;
    background:#d6c7ba;position:relative;cursor:pointer;flex:0 0 52px;
  }
  .toggle::after{
    content:"";position:absolute;top:4px;left:4px;
    width:22px;height:22px;border-radius:50%;background:white;
    transition:.18s;
  }
  .toggle.on{background:#80be86}
  .toggle.on::after{left:26px}

  .searchBox{
    position:sticky;
    top:0;
    z-index:2;
    background:var(--panel);
    padding:4px 0 10px;
  }
  .searchInput{
    width:100%;
    border:1px solid var(--line);
    border-radius:16px;
    padding:11px 12px;
    background:white;
    color:var(--ink);
    outline:none;
  }
  .hitMark{
    display:inline-block;
    font-size:11px;
    color:#9b675f;
    background:#ffe7dc;
    border-radius:999px;
    padding:2px 8px;
    margin-top:6px;
  }

  .listItem{
    border:1px solid var(--line);
    background:white;
    border-radius:16px;
    padding:12px;
    margin:8px 0;
    cursor:pointer;
  }
  .listItem strong{display:block;margin-bottom:4px}
  .listItem small{color:var(--muted)}
  .lock{
    position:absolute; inset:0;
    background:#030303;
    color:white;
    display:none;
    z-index:50;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    overflow:hidden;
    user-select:none;
  }
  .lock.show{display:flex}
  .eyes{
    width:220px;height:90px;
    position:relative;
    animation:floaty 5.8s ease-in-out infinite;
  }
  .eye{
    position:absolute;top:25px;
    width:54px;height:34px;
    border-radius:50%;
    background:radial-gradient(circle at 55% 45%,#fff 0 10%,#ffd06a 11% 35%,#111 36% 55%,#ffdc84 56% 100%);
    box-shadow:0 0 18px rgba(255,208,106,.42),0 0 42px rgba(255,208,106,.18);
    transform-origin:center;
    animation:blink 7s infinite;
  }
  .eye.left{left:34px}
  .eye.right{right:34px}
  .shell{
    font-size:34px;
    opacity:.28;
    margin-top:18px;
    animation:pulse 4s ease-in-out infinite;
  }

  .catParts{
    position:absolute;
    width:220px;
    height:120px;
    top:calc(50% - 96px);
    left:50%;
    transform:translateX(-50%);
    pointer-events:none;
  }
  .ear{
    position:absolute;
    top:0;
    width:0;height:0;
    border-left:28px solid transparent;
    border-right:28px solid transparent;
    border-bottom:58px solid rgba(255,255,255,.16);
    filter:drop-shadow(0 0 12px rgba(255,255,255,.08));
  }
  .leftEar{left:34px; transform:rotate(-18deg)}
  .rightEar{right:34px; transform:rotate(18deg)}  .lockMood{
    position:absolute;
    top:calc(50% + 64px);
    color:rgba(255,255,255,.42);
    font-size:22px;
    letter-spacing:.2em;
  }
  .lock.eyesOnly .catParts{display:none}  .lock.half .eye{height:15px; top:35px; opacity:.86}
  .lock.teary .eye::after{
    content:"";
    position:absolute;
    width:9px;height:16px;
    background:rgba(135,211,255,.7);
    border-radius:999px;
    bottom:-18px;right:9px;
    box-shadow:0 0 12px rgba(135,211,255,.45);
  }

  .lockHint{
    position:absolute;
    bottom:calc(26px + env(safe-area-inset-bottom));
    color:rgba(255,255,255,.34);
    font-size:12px;
    letter-spacing:.12em;
  }
  .passBox{
    display:none;
    position:absolute;
    bottom:calc(60px + env(safe-area-inset-bottom));
    width:min(280px,80%);
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16);
    border-radius:18px;
    padding:12px;
    backdrop-filter: blur(10px);
  }
  .passBox.show{display:block}
  .passBox input{
    width:100%;padding:11px;border-radius:12px;border:1px solid rgba(255,255,255,.18);
    background:rgba(0,0,0,.35);color:white;outline:none;text-align:center;
    letter-spacing:.2em;
  }
  .passErr{height:18px;color:#ffaaa4;text-align:center;font-size:12px;margin-top:7px}
  @keyframes blink{
    0%,4%,8%,100%{transform:scaleY(1)}
    5%,6.4%{transform:scaleY(.06)}
    58%,61%,64%{transform:scaleY(1)}
    62%{transform:scaleY(.08)}
  }
  @keyframes floaty{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
  }
  @keyframes pulse{
    0%,100%{opacity:.22;transform:scale(1)}
    50%{opacity:.38;transform:scale(1.05)}
  }
  .empty{
    color:var(--muted);
    text-align:center;
    padding:28px 8px;
  }

  .tinyNote{
    font-size:12px;
    line-height:1.6;
    color:var(--muted);
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 12px;
  }

  .toast{
    position:absolute;
    left:50%;bottom:92px;
    transform:translateX(-50%);
    background:rgba(58,44,36,.9);
    color:white;
    padding:9px 13px;
    border-radius:999px;
    font-size:13px;
    display:none;
    z-index:60;
  }
  .toast.show{display:block}
  @media (min-width:721px){
    .app{height:96svh;margin-top:2svh;border-radius:24px}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="topBtns">
      <button class="btn" id="newBtn">新規</button>
    </div>
    <div class="title">
      <span id="appTitle">ひとりメモ</span>
      <small>ひとりチャットメモ</small>
    </div>
    <div class="topBtns right">
      <button class="btn" id="saveBtn">保存</button>
      <button class="btn" id="listBtn">一覧</button>
      <button class="btn" id="settingsBtn">⚙︎</button>
    </div>
  </header>

  <main class="chat" id="chat">
    <div class="day">きょう</div>
  </main>

  <div class="composer">
    <textarea id="input" placeholder="メモを書く...（改行OK）" rows="1"></textarea>
    <button class="send" id="sendBtn">送信</button>
  </div>

  <section class="lock" id="lock">
    <div class="eyes">
      <div class="eye left"></div>
      <div class="eye right"></div>
    </div>
    
    <div class="catParts" id="catParts">
      <div class="ear leftEar"></div>
      <div class="ear rightEar"></div>    </div>
    <div class="lockMood" id="lockMood"></div>

    <div class="passBox" id="passBox">
      <input id="passInput" type="password" inputmode="numeric" placeholder="PASS" />
      <div class="passErr" id="passErr"></div>
    </div>
    <div class="lockHint" id="lockHint">tap to wake</div>
  </section>

  <div class="overlay" id="overlay">
    <div class="modal" id="modal"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const STORAGE_KEY = "hitori_memo_current_v4";
const SAVED_KEY = "hitori_memo_saved_v4";
const SETTINGS_KEY = "hitori_memo_settings_v4";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const newBtn = document.getElementById("newBtn");
const saveBtn = document.getElementById("saveBtn");
const listBtn = document.getElementById("listBtn");
const settingsBtn = document.getElementById("settingsBtn");
const overlay = document.getElementById("overlay");
const modal = document.getElementById("modal");
const lock = document.getElementById("lock");
const passBox = document.getElementById("passBox");
const passInput = document.getElementById("passInput");
const passErr = document.getElementById("passErr");
const lockHint = document.getElementById("lockHint");
const toast = document.getElementById("toast");

let current = loadCurrent();
let settings = loadSettings();
let lockTimer = null;
let isLocked = false;

function defaultSettings(){
  return {
    appName: "ひとりメモ",
    reply: true,
    lockAnim: true,
    lockSeconds: 60,
    botMode: "hai",
    tipReply: true,
    lockLook: "cat",
    eyeMood: "normal"
  };
}
function loadSettings(){
  try { return {...defaultSettings(), ...JSON.parse(localStorage.getItem(SETTINGS_KEY)||"{}")}; }
  catch(e){ return defaultSettings(); }
}
function saveSettings(){ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }

function loadCurrent(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {messages:[], dirty:false}; }
  catch(e){ return {messages:[], dirty:false}; }
}
function persistCurrent(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(current));
}
function loadSaved(){
  try { return JSON.parse(localStorage.getItem(SAVED_KEY)) || []; }
  catch(e){ return []; }
}
function saveSaved(items){
  localStorage.setItem(SAVED_KEY, JSON.stringify(items));
}
function nowTime(){
  const d = new Date();
  return d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
}
function nowDateKey(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function dateLabel(dateKey){
  if(!dateKey) dateKey = nowDateKey();
  const parts = dateKey.split("-");
  const y = Number(parts[0]);
  const m = Number(parts[1]);
  const d = Number(parts[2]);
  const dt = new Date(y, m-1, d);
  const week = ["日","月","火","水","木","金","土"][dt.getDay()];
  return `${m}/${d}（${week}）`;
}
function addDayLabel(label){
  const div = document.createElement("div");
  div.className = "day";
  div.textContent = label;
  chat.appendChild(div);
}


function resizeImageToDataUrl(file, maxSize=900, quality=0.82){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function applySettingsToUI(){
  const titleEl = document.getElementById("appTitle");
  if(titleEl) titleEl.textContent = settings.appName || "ひとりメモ";

  lock.classList.toggle("eyesOnly", settings.lockLook === "eyes");
  lock.classList.toggle("half", settings.eyeMood === "half");
  lock.classList.toggle("teary", settings.eyeMood === "teary");

  const mood = document.getElementById("lockMood");
  if(mood){
    mood.textContent = "";
  }
}

function render(){
  applySettingsToUI();
  chat.innerHTML = "";
  if(current.messages.length === 0){
    addDayLabel(dateLabel(nowDateKey()));
    const emp = document.createElement("div");
    emp.className = "empty";
    emp.textContent = "ひとりチャットみたいに、ここへ投げる。";
    chat.appendChild(emp);
  }

  let lastDate = "";
  current.messages.forEach((m,i) => {
    const d = m.date || nowDateKey();
    if(d !== lastDate){
      addDayLabel(dateLabel(d));
      lastDate = d;
    }
    addMessageEl(m.role, m.text, m.time, false, i);
  });
  chat.scrollTop = chat.scrollHeight;
}
function addMessage(role,text){
  const msg = {role,text,time:nowTime(),date:nowDateKey()};
  const prev = current.messages[current.messages.length - 1];
  current.messages.push(msg);
  current.dirty = true;
  persistCurrent();

  const empty = chat.querySelector(".empty");
  if(empty) empty.remove();

  if(!prev || (prev.date || nowDateKey()) !== msg.date){
    addDayLabel(dateLabel(msg.date));
  }
  addMessageEl(role,text,msg.time,true,current.messages.length - 1);
}
function addMessageEl(role,text,time,scroll=true,indexOverride=null){
  const row = document.createElement("div");
  row.className = "row " + (role === "user" ? "user" : "bot");
  const msgIndex = indexOverride !== null ? indexOverride : current.messages.length - 1;
  if(role === "bot"){
    const av = document.createElement("div");
    av.className = "avatar";
    av.textContent = settings.lockLook === "cat" ? "🐱" : "👀";
    row.appendChild(av);
  }
  const bubble = document.createElement("div");
  bubble.className = "bubble editable";
  bubble.textContent = text;
  bubble.dataset.index = msgIndex;
  attachEditHandlers(bubble);
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = time || "";
  if(role === "user"){
    row.appendChild(meta);
    row.appendChild(bubble);
  }else{
    row.appendChild(bubble);
    row.appendChild(meta);
  }
  const empty = chat.querySelector(".empty");
  if(empty) empty.remove();
  chat.appendChild(row);
  if(scroll) chat.scrollTop = chat.scrollHeight;
}
function send(){
  const text = input.value.trim();
  if(!text) return;
  addMessage("user", text);
  input.value = "";
  autoGrow();
  if(settings.reply){
    const reply = makeReply(text);
    if(reply) setTimeout(()=>addMessage("bot", reply), 260);
  }
  resetLockTimer();
}
function makeReply(text){
  // このアプリの返事は、考えずに受けるだけ。
  if(settings.botMode === "off") return "";

  let base = "はーい";
  if(settings.botMode === "random"){
    const arr = ["はーい","了解","メモった","うん","🫡"];
    base = arr[Math.floor(Math.random()*arr.length)];
  }

  if(settings.tipReply){
    const tip = pickFeatureTip();
    if(tip){
      return `${base}\n${tip}`;
    }
  }
  return base;
}

function pickFeatureTip(){
  // うるさくならないよう、たまにだけ出す。
  // 最初の数回は少し出やすく、その後は約25%。
  const userCount = current.messages.filter(m => m.role === "user").length;
  const shouldShow = userCount <= 3 || Math.random() < 0.25;
  if(!shouldShow) return "";

  const tips = [
    "長押しで修正できるよー",
    "保存したメモは一覧から検索できるよー",
    "保存は自分で押した時だけだよー",
    "放置すると画面が隠れるよー",
    "名前は設定から変えられるよー",
    "改行もそのままできるよー"
  ];

  // 直近の返事と同じヒントを避ける
  const lastBot = [...current.messages].reverse().find(m => m.role === "bot");
  const lastText = lastBot ? lastBot.text : "";
  const candidates = tips.filter(t => !lastText.includes(t));
  return candidates[Math.floor(Math.random() * candidates.length)] || "";
}
function extractWords(text){
  const stop = ["これ","それ","あれ","今日","明日","昨日","あと","また","かな","やわ","する","した","して","行く","行かない","思う","かも","ちょっと"];
  const candidates = [];
  const re = /[一-龠々ァ-ヶーA-Za-z0-9０-９]{2,}/g;
  let m;
  while((m = re.exec(text)) !== null){
    let w = m[0];
    if(stop.includes(w)) continue;
    if(/^[0-9０-９]+$/.test(w)) continue;
    candidates.push(w);
  }
  const priority = ["梅田ヨドバシ","ヨドバシ","病院","歯医者","ラズパイ","Raspberry","Pi5","note","仕事","買い物","牛乳"];
  for(const p of priority){
    if(text.includes(p)) return [p];
  }
  return candidates;
}

function attachEditHandlers(el){
  let timer = null;
  const start = () => {
    timer = setTimeout(() => {
      const idx = Number(el.dataset.index);
      openEditMessage(idx);
    }, 650);
  };
  const cancel = () => {
    clearTimeout(timer);
    timer = null;
  };
  el.addEventListener("pointerdown", start);
  el.addEventListener("pointermove", cancel);
  el.addEventListener("pointerup", cancel);
  el.addEventListener("pointerleave", cancel);
  el.addEventListener("dblclick", () => {
    const idx = Number(el.dataset.index);
    openEditMessage(idx);
  });
}

function openEditMessage(idx){
  if(!Number.isInteger(idx) || !current.messages[idx]) return;
  const msg = current.messages[idx];
  openModal(`
    <div class="modalHead"><h2>メモを修正</h2><button class="iconBtn" type="button" data-close-modal>×</button></div>
    <div class="field">
      <label>内容</label>
      <textarea id="editMessageText" rows="7" style="width:100%;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:white;color:var(--ink);resize:vertical;">${escapeHtml(msg.text)}</textarea>
    </div>
    <div class="tinyNote">長押し、またはダブルクリックでこの修正画面を開けます。</div>
    <div class="modalActions">
      <button class="btn" id="saveEdit">修正する</button>
      <button class="btn" id="deleteMsg">この行を削除</button>
      <button type="button" class="btn" id="cancelEdit" data-close-modal>戻る</button>
    </div>
  `);
  document.getElementById("cancelEdit").onclick = closeModal;
  document.getElementById("saveEdit").onclick = () => {
    const val = document.getElementById("editMessageText").value.trim();
    if(val){
      current.messages[idx].text = val;
      current.dirty = true;
      persistCurrent();
      closeModal();
      render();
      showToast("修正した");
    }
  };
  document.getElementById("deleteMsg").onclick = () => {
    current.messages.splice(idx,1);
    current.dirty = true;
    persistCurrent();
    closeModal();
    render();
    showToast("削除した");
  };
}

function autoGrow(){
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight,132) + "px";
}
function showToast(t){
  toast.textContent = t;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),1400);
}
function openModal(html){
  modal.innerHTML = html;
  overlay.style.display = "flex";
}
function closeModal(){
  overlay.style.display = "none";
  modal.innerHTML = "";
  resetLockTimer();
}

document.addEventListener("click", e => {
  const closeTarget = e.target.closest && e.target.closest("[data-close-modal]");
  if(closeTarget){
    e.preventDefault();
    e.stopPropagation();
    closeModal();
  }
}, true);

overlay.addEventListener("click", e => {
  if(e.target === overlay) closeModal();
});

document.addEventListener("click", e => {
  const closeTarget = e.target.closest && e.target.closest("[data-close-modal]");
  if(closeTarget){
    closeModal();
  }
});

document.addEventListener("keydown", e => {
  if(e.key === "Escape" && overlay.style.display === "flex"){
    closeModal();
  }
});
function suggestTitle(){
  const firstUser = current.messages.find(m=>m.role==="user")?.text || "無題メモ";
  const words = extractWords(firstUser);
  return words[0] || firstUser.slice(0,18);
}
function saveCurrentThen(callback){
  if(current.messages.length === 0){
    showToast("まだメモがないよ");
    return;
  }
  const title = suggestTitle();
  openModal(`
    <div class="modalHead"><h2>保存</h2><button class="iconBtn" type="button" data-close-modal>×</button></div>
    <div class="field">
      <label>タイトル</label>
      <input id="titleInput" value="${escapeHtml(title)}" />
    </div>
    <div class="modalActions">
      <button class="btn" id="doSave">保存</button>
      <button class="btn" id="shareCurrent">共有 / コピー</button>
      <button type="button" class="btn" id="cancel" data-close-modal>戻る</button>
    </div>
  `);
  document.getElementById("cancel").onclick = closeModal;
  const shareBtn = document.getElementById("shareCurrent");
  if(shareBtn) shareBtn.onclick = () => shareText(messagesToText(current.messages), document.getElementById("titleInput").value.trim() || "ひとりチャットメモ");
  document.getElementById("doSave").onclick = () => {
    const titleVal = document.getElementById("titleInput").value.trim() || "無題メモ";
    const items = loadSaved();
    items.unshift({
      id: Date.now(),
      title:titleVal,
      created:new Date().toISOString(),
      messages:[...current.messages]
    });
    saveSaved(items);
    current.dirty = false;
    persistCurrent();
    closeModal();
    showToast("保存した");
    if(callback) callback();
  };
}
function newFlow(){
  if(current.messages.length && current.dirty){
    openModal(`
      <div class="modalHead"><h2>新規メモ</h2><button class="iconBtn" type="button" data-close-modal>×</button></div>
      <p>今の流れは未保存です。</p>
      <div class="modalActions">
        <button class="btn" id="saveNew">保存して新規</button>
        <button class="btn" id="dropNew">保存せず新規</button>
        <button type="button" class="btn" id="back" data-close-modal>戻る</button>
      </div>
    `);
    document.getElementById("saveNew").onclick = () => saveCurrentThen(()=>clearCurrent());
    document.getElementById("dropNew").onclick = () => { closeModal(); clearCurrent(); };
    document.getElementById("back").onclick = closeModal;
  }else{
    clearCurrent();
  }
}
function clearCurrent(){
  current = {messages:[], dirty:false};
  persistCurrent();
  render();
  showToast("新規にした");
}

function messagesToText(messages=current.messages){
  return messages.map(m => {
    const who = m.role === "user" ? "自分" : (settings.appName || "ひとりメモ");
    return `${who}: ${m.text}`;
  }).join("\\n");
}

async function shareText(text, title="ひとりチャットメモ"){
  if(!text.trim()){
    showToast("共有する内容がないよ");
    return;
  }
  if(navigator.share){
    try{
      await navigator.share({title, text});
      return;
    }catch(e){
      return;
    }
  }
  try{
    await navigator.clipboard.writeText(text);
    showToast("コピーした");
  }catch(e){
    openModal(`
      <div class="modalHead"><h2>コピー</h2><button class="iconBtn" type="button" data-close-modal>×</button></div>
      <div class="field">
        <label>この内容をコピーしてメモアプリに貼ってください</label>
        <textarea rows="10" style="width:100%;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:white;color:var(--ink);">${escapeHtml(text)}</textarea>
      </div>
      <div class="modalActions"><button type="button" class="btn" id="closeCopy" data-close-modal>閉じる</button></div>
    `);
    document.getElementById("closeCopy").onclick = closeModal;
  }
}

function showList(){
  const items = loadSaved();
  let body = `<div class="modalHead"><h2>保存済みメモ</h2><button class="iconBtn" type="button" data-close-modal>×</button></div>
    <div class="searchBox">
      <input id="memoSearch" class="searchInput" placeholder="保存済みメモを検索..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
    </div>
    <div id="memoListResults"></div>
    <div class="tinyNote">タイトルと本文から検索できます。タップするとそのメモを開きます。</div>
    <div class="tinyNote">公式メモアプリへ直接保存はブラウザからはできません。保存画面の「共有 / コピー」から、共有先にメモアプリを選ぶか、コピーして貼り付けてください。</div>
    <div class="modalActions"><button type="button" class="btn" id="closeList" data-close-modal>閉じる</button></div>`;
  openModal(body);

  const inputEl = document.getElementById("memoSearch");
  const resultsEl = document.getElementById("memoListResults");

  function itemText(item){
    return [
      item.title || "",
      ...(item.messages || []).map(m => m.text || "")
    ].join(" ");
  }

  function renderResults(query=""){
    const q = query.trim().toLowerCase();
    let filtered = items;
    if(q){
      filtered = items.filter(item => itemText(item).toLowerCase().includes(q));
    }

    if(!filtered.length){
      resultsEl.innerHTML = `<div class="empty">${q ? "見つからなかったよ。" : "保存済みメモはまだないよ。"}</div>`;
      return;
    }

    resultsEl.innerHTML = filtered.map(item=>{
      const preview = (item.messages || []).filter(m=>m.role==="user").map(m=>m.text).join(" / ").slice(0,72);
      const date = new Date(item.created).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
      const hit = q ? `<span class="hitMark">検索一致</span>` : "";
      return `<div class="listItem" data-id="${item.id}">
        <strong>${escapeHtml(item.title)}</strong>
        <small>${escapeHtml(date)}　${escapeHtml(preview)}</small><br>${hit}
      </div>`;
    }).join("");

    resultsEl.querySelectorAll(".listItem").forEach(el=>{
      el.onclick = () => {
        const id = Number(el.dataset.id);
        const item = items.find(x=>x.id===id);
        if(!item) return;
        current = {messages:[...(item.messages || [])], dirty:false};
        persistCurrent();
        closeModal();
        render();
      };
    });
  }

  inputEl.addEventListener("input", () => renderResults(inputEl.value));
  document.getElementById("closeList").onclick = closeModal;
  renderResults();
}
function showSettings(){
  openModal(`
    <div class="modalHead"><h2>設定</h2><button class="iconBtn" type="button" data-close-modal>×</button></div>

    <div class="field">
      <label>この子に名前をつけてね</label>
      <input id="appName" value="${escapeHtml(settings.appName || "ひとりメモ")}" placeholder="例：メモさん、ねこメモ、ひとりごと" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
    </div>

    <div class="switchRow">
      <span>返事<small>オフなら完全に1人チャットメモ</small></span>
      <button class="toggle ${settings.reply?'on':''}" id="replyToggle"></button>
    </div>

    <div class="field">
      <label>相槌タイプ</label>
      <select id="botMode">
        <option value="hai" ${settings.botMode==="hai"?"selected":""}>固定：はーい</option>
        <option value="random" ${settings.botMode==="random"?"selected":""}>ランダム：はーい / 了解 / メモった / うん / 🫡</option>
        <option value="off" ${settings.botMode==="off"?"selected":""}>返事なし</option>
      </select>
    </div>

    <div class="switchRow">
      <span>機能ヒント<small>たまに使い方を短く教えます</small></span>
      <button class="toggle ${settings.tipReply?'on':''}" id="tipReplyToggle"></button>
    </div>

    <div class="switchRow">
      <span>ロック風アニメ<small>放置時にテキストを全部隠します</small></span>
      <button class="toggle ${settings.lockAnim?'on':''}" id="lockToggle"></button>
    </div>

    <div class="field">
      <label>ロック画面の見た目</label>
      <select id="lockLook">
        <option value="cat" ${settings.lockLook==="cat"?"selected":""}>猫：耳つき</option>
        <option value="eyes" ${settings.lockLook==="eyes"?"selected":""}>目だけ</option>
      </select>
    </div>

    <div class="field">
      <label>目だけモードの表情</label>
      <select id="eyeMood">
        <option value="normal" ${settings.eyeMood==="normal"?"selected":""}>通常</option>
        <option value="half" ${settings.eyeMood==="half"?"selected":""}>半目</option>
        <option value="teary" ${settings.eyeMood==="teary"?"selected":""}>涙目</option>
      </select>
    </div>

    <div class="field">
      <label>自動ロックまで</label>
      <select id="lockSeconds">
        <option value="30" ${settings.lockSeconds==30?"selected":""}>30秒</option>
        <option value="60" ${settings.lockSeconds==60?"selected":""}>1分</option>
        <option value="300" ${settings.lockSeconds==300?"selected":""}>5分</option>
        <option value="600" ${settings.lockSeconds==600?"selected":""}>10分</option>
      </select>
    </div>

    <div class="field">
      <label>iPhoneの自動入力について</label>
      <div style="font-size:12px;line-height:1.6;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;">
        iPhoneのSafariでは、表示名の入力時に「連絡先を自動入力」が出る場合があります。<br>
        これはSafari側の表示です。この欄には連絡先ではなく、この子の呼び名だけを入れてください。
      </div>
    </div>

    <div class="modalActions">
      <button class="btn" id="saveSettings">設定を保存</button>
      <button type="button" class="btn" id="cancelSettings" data-close-modal>閉じる</button>
    </div>
  `);

  document.getElementById("replyToggle").onclick = e => {
    settings.reply = !settings.reply; e.currentTarget.classList.toggle("on", settings.reply);
  };
  const tipReplyToggle = document.getElementById("tipReplyToggle");
  if(tipReplyToggle){
    tipReplyToggle.onclick = e => {
      settings.tipReply = !settings.tipReply;
      e.currentTarget.classList.toggle("on", settings.tipReply);
    };
  }

  document.getElementById("lockToggle").onclick = e => {
    settings.lockAnim = !settings.lockAnim; e.currentTarget.classList.toggle("on", settings.lockAnim);
  };  document.getElementById("catBellToggle").onclick = e => {
    settings.catBell = !settings.catBell; e.currentTarget.classList.toggle("on", settings.catBell);
  };

  document.getElementById("saveSettings").onclick = () => {
    settings.appName = document.getElementById("appName").value.trim() || "ひとりメモ";
    settings.botMode = document.getElementById("botMode").value;
    settings.lockLook = document.getElementById("lockLook").value;
    settings.eyeMood = document.getElementById("eyeMood").value;
    settings.lockSeconds = Number(document.getElementById("lockSeconds").value);    saveSettings();
    applySettingsToUI();
    closeModal();
    resetLockTimer();
    showToast("設定した");
  };
  const cancelSettings = document.getElementById("cancelSettings");
  if(cancelSettings) cancelSettings.onclick = closeModal;
}
function lockNow(){
  applySettingsToUI();
  if(!settings.lockAnim || overlay.style.display === "flex") return;
  isLocked = true;
  lock.classList.add("show");
  passErr.textContent = "";
  passInput.value = "";
  passBox.classList.remove("show");
  lockHint.textContent = "tap to wake";
}
function unlockTry(){
  if(!isLocked) return;
  unlock();
}
function unlock(){
  isLocked = false;
  lock.classList.remove("show");
  passBox.classList.remove("show");
  resetLockTimer();
  input.focus();
}
function resetLockTimer(){
  clearTimeout(lockTimer);
  if(settings.lockAnim){
    lockTimer = setTimeout(lockNow, settings.lockSeconds * 1000);
  }
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]));
}

sendBtn.onclick = send;
input.addEventListener("input", () => { autoGrow(); resetLockTimer(); });
input.addEventListener("keydown", e => {
  // メモ用途なので、Enter / Return は改行に使う。
  // 送信は右下の「送信」ボタンで行う。
  resetLockTimer();
});
newBtn.onclick = () => { resetLockTimer(); newFlow(); };
saveBtn.onclick = () => { resetLockTimer(); saveCurrentThen(); };
listBtn.onclick = () => { resetLockTimer(); showList(); };
settingsBtn.onclick = () => { resetLockTimer(); showSettings(); };

["click","touchstart","keydown","mousemove"].forEach(ev=>{
  document.addEventListener(ev, () => { if(!isLocked) resetLockTimer(); }, {passive:true});
});
lock.addEventListener("click", unlockTry);
passInput.addEventListener("keydown", e=>{
  if(e.key === "Enter") unlock();
});
applySettingsToUI();
render();
resetLockTimer();
</script>
</body>
</html>
